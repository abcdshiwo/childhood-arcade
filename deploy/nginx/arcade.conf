# Stage 2: install only after Certbot has created the certificate paths below.
# This host relies on the existing global $connection_upgrade map.
server {
    listen 80;
    listen [::]:80;
    server_name arcade.abcds.de;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name arcade.abcds.de;

    ssl_certificate /etc/letsencrypt/live/arcade.abcds.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arcade.abcds.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 101m;
    access_log /var/log/nginx/arcade.access.log combined;
    error_log /var/log/nginx/arcade.error.log warn;

    # The room password is currently carried in the WebSocket query string.
    # Do not write this request target to access logs or routine error logs.
    location ~ ^/api/rooms/[^/]+/ws/?$ {
        access_log off;
        error_log /var/log/nginx/arcade-websocket.error.log crit;

        proxy_pass http://127.0.0.1:19097;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }

    location / {
        proxy_pass http://127.0.0.1:19097;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Replace, rather than append to, the client-supplied X-Forwarded-For.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
