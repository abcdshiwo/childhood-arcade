# Stage 1: install this file before requesting the first certificate. Every
# request except the ACME HTTP-01 challenge intentionally returns 503.
server {
    listen 80;
    listen [::]:80;
    server_name arcade.abcds.de;

    access_log /var/log/nginx/arcade-bootstrap.access.log combined;
    error_log /var/log/nginx/arcade-bootstrap.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        add_header Retry-After 300 always;
        return 503;
    }
}
