# Restrict the dedicated account to the one local forward required by the
# proxy host. Install in /etc/ssh/sshd_config.d/ and validate with `sshd -t`.
Match User childhood-arcade-tunnel
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    AllowTcpForwarding local
    GatewayPorts no
    PermitListen none
    PermitOpen 127.0.0.1:19097
    PermitTTY no
    PermitTunnel no
    PermitUserEnvironment no
    PermitUserRC no
    X11Forwarding no
    ForceCommand /bin/false

Match all
