name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Run regression tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Check server syntax
        run: node --check server/index.js

      - name: Smoke-test better-sqlite3
        run: |
          node --input-type=module <<'NODE'
          import Database from 'better-sqlite3'

          const database = new Database(':memory:')
          database.exec('CREATE TABLE smoke (value TEXT NOT NULL)')
          database.prepare('INSERT INTO smoke (value) VALUES (?)').run('ok')
          const row = database.prepare('SELECT value FROM smoke').get()
          database.close()

          if (row?.value !== 'ok') {
            throw new Error('better-sqlite3 in-memory smoke test failed')
          }
          NODE

      - name: Check health script syntax
        run: sh -n deploy/bin/childhood-arcade-healthcheck.sh

      - name: Check health unit executable condition
        run: |
          grep -Fqx \
            'ConditionFileIsExecutable=/usr/local/libexec/childhood-arcade-healthcheck' \
            deploy/systemd/childhood-arcade-healthcheck.service
          if grep -R 'ConditionPathIsExecutable' deploy/systemd; then
            exit 1
          fi

      - name: Validate restricted SSHD Match block
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server
          sudo ssh-keygen -A
          printf 'HostKey /etc/ssh/ssh_host_ed25519_key\nUsePAM no\nInclude %s\n' \
            "$GITHUB_WORKSPACE/deploy/sshd/60-childhood-arcade-tunnel.conf" \
            > "$RUNNER_TEMP/childhood-arcade-sshd_config"
          sudo /usr/sbin/sshd -t -f "$RUNNER_TEMP/childhood-arcade-sshd_config"

      - name: Validate tunnel systemd unit
        run: |
          sudo useradd --system --user-group \
            --home-dir /var/lib/childhood-arcade-tunnel \
            --shell /usr/sbin/nologin childhood-arcade-tunnel
          systemd-analyze verify deploy/systemd/childhood-arcade-tunnel.service

      - name: Validate Nginx site config
        run: |
          test_dir="$RUNNER_TEMP/nginx-test"
          cert_dir="$test_dir/cert"
          mkdir -p "$cert_dir"
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -subj '/CN=arcade.abcds.de' \
            -keyout "$cert_dir/privkey.pem" \
            -out "$cert_dir/fullchain.pem" >/dev/null 2>&1
          sed \
            -e 's#/etc/letsencrypt/live/arcade.abcds.de/fullchain.pem#/work/cert/fullchain.pem#' \
            -e 's#/etc/letsencrypt/live/arcade.abcds.de/privkey.pem#/work/cert/privkey.pem#' \
            deploy/nginx/arcade.conf > "$test_dir/arcade.conf"
          printf 'events {}\nhttp {\nmap $http_upgrade $connection_upgrade { default upgrade; "" close; }\ninclude %s;\n}\n' \
            '/work/arcade.conf' > "$test_dir/nginx.conf"
          docker run --rm \
            -v "$test_dir:/work:ro" \
            nginx:1.26.3-alpine@sha256:1eadbb07820339e8bbfed18c771691970baee292ec4ab2558f1453d26153e22d \
            nginx -t -c /work/nginx.conf
